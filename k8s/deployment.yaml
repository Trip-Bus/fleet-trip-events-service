# Despliegue en Kubernetes de fleet-trip-events-service (namespace tripbus).
# Requiere los recursos compartidos de API-gateway/k8s/infra (ConfigMap, Secret, PostgreSQL, Redis).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-trip-events-service
  namespace: tripbus
  labels:
    app: fleet-trip-events-service
    app.kubernetes.io/part-of: tripbus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fleet-trip-events-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: fleet-trip-events-service
        app.kubernetes.io/part-of: tripbus
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "16005"
    spec:
      containers:
        - name: fleet-trip-events-service
          image: ghcr.io/trip-bus/fleet-trip-events-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 16005
              name: http
          envFrom:
            - configMapRef:
                name: tripbus-config
            - secretRef:
                name: tripbus-secrets
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-trip-events-service
  namespace: tripbus
  labels:
    app: fleet-trip-events-service
spec:
  selector:
    app: fleet-trip-events-service
  ports:
    - name: http
      port: 16005
      targetPort: http
---
# Simulador GPS del MVP: misma imagen, solo ejecuta el job que mueve los buses.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-gps-simulator
  namespace: tripbus
  labels:
    app: fleet-gps-simulator
    app.kubernetes.io/part-of: tripbus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fleet-gps-simulator
  template:
    metadata:
      labels:
        app: fleet-gps-simulator
    spec:
      containers:
        - name: simulator
          image: ghcr.io/trip-bus/fleet-trip-events-service:latest
          envFrom:
            - configMapRef:
                name: tripbus-config
            - secretRef:
                name: tripbus-secrets
          env:
            - name: SIMULATOR_ENABLED
              value: "true"
            - name: EVENTS_CONSUMER_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 320Mi
            limits:
              memory: 512Mi
