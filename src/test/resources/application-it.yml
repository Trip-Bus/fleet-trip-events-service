# Perfil de pruebas de integración (FleetIT). PostgreSQL y Redis los levanta Testcontainers y
# @ServiceConnection inyecta su host/puerto: aquí solo va lo propio de las pruebas.
spring:
  flyway:
    # FleetIT hace flyway.clean() + migrate() antes de empezar (base limpia y migraciones reales).
    clean-disabled: false

tripbus:
  events:
    # Stream aparte para no mezclar eventos de prueba con los de QA.
    stream: tripbus:events:test
    # Sin consumidor en segundo plano: las pruebas invocan los handlers directamente.
    consumer-enabled: false
