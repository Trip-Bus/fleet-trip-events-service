spring:
  application:
    name: fleet-trip-events-service

  datasource:
    url: jdbc:postgresql://${DB_URL:localhost}:${DB_PORT:5432}/tripbus_fleet
    username: ${DB_USERNAME:tripbus}
    password: ${DB_PASSWORD:tripbus_local_pw}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:16001/.well-known/jwks.json}

server:
  port: 16005
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: fleet-trip-events-service

tripbus:
  internal-token: ${INTERNAL_API_TOKEN:tripbus-internal-dev-token}
  events:
    enabled: ${EVENTS_ENABLED:true}
    consumer-enabled: ${EVENTS_CONSUMER_ENABLED:true}
    stream: ${EVENTS_STREAM:tripbus:events}
    max-len: 100000
    group: fleet-trip-events-service
  fleet:
    telemetry-stream: ${TELEMETRY_STREAM:tripbus:telemetry}
    telemetry-group: fleet-telemetry
    max-position-age: 10m
    catalog-url: ${CATALOG_URL:http://localhost:16002}
    # Simulador GPS del MVP (job separado): mueve los buses de los viajes en curso.
    simulator-enabled: ${SIMULATOR_ENABLED:false}
  jobs:
    simulator-interval-ms: 5000
    outbox-relay-ms: 500
