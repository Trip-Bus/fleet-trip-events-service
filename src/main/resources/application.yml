spring:
  application:
    name: fleet-trip-events-service

  # "qa" y "prod" activan además el perfil "desplegado" (exige secretos, sin valores por defecto).
  profiles:
    group:
      qa: desplegado
      prod: desplegado

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:18105}/${DB_NAME:tripbus_fleet}
    username: ${DB_USERNAME:fleet}
    password: ${DB_PASSWORD:fleet_qa_pw}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:18100}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:18001/.well-known/jwks.json}

server:
  port: ${SERVER_PORT:18005}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: fleet-trip-events-service
  info:
    env:
      enabled: true

# /actuator/info: commit con el que se construyó la imagen (build-arg GIT_COMMIT del Dockerfile).
info:
  app:
    commit: ${APP_COMMIT:local}

tripbus:
  internal-token: ${INTERNAL_API_TOKEN:tripbus_internal_qa_token}
  services:
    # US-121: validar al conductor que se asigna a un viaje (GET /internal/users/{id}).
    identity-url: ${IDENTITY_URL:http://localhost:18001}
  events:
    enabled: ${EVENTS_ENABLED:true}
    consumer-enabled: ${EVENTS_CONSUMER_ENABLED:true}
    stream: ${EVENTS_STREAM:tripbus:events}
    max-len: 100000
    group: fleet-trip-events-service
  fleet:
    telemetry-stream: ${TELEMETRY_STREAM:tripbus:telemetry}
    telemetry-group: fleet-telemetry
    max-position-age: 10m
    catalog-url: ${CATALOG_URL:http://localhost:18002}
    # Simulador GPS del MVP (job separado): mueve los buses de los viajes en curso.
    simulator-enabled: ${SIMULATOR_ENABLED:false}
    # US-039/US-047: la posición solo es pública mientras el bus hace un viaje
    # (de fechaSalida - before a fechaLlegada + after; nunca si el viaje está cancelado).
    tracking-window-before: 30m
    tracking-window-after: 30m
    # US-173: lecturas del celular con precisión peor que esto (metros) se descartan.
    max-accuracy-m: 100
    # US-174: una sesión ACTIVO sin posiciones por más de esto pasa a SIN_SENAL.
    signal-timeout: 60s
    # US-171: ítems del checklist de salida; todos deben venir en true para iniciar el viaje.
    checklist-items: manifiestoRevisado,documentosBus,lucesYLlantas,botiquinYExtintor
  jobs:
    simulator-interval-ms: 5000
    # US-174/US-175: job de estados de rastreo (SIN_SENAL, FINALIZADO), en un solo nodo.
    tracking-status-ms: 15000
    outbox-relay-ms: 500
